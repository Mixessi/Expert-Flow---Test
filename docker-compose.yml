version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: expertflow-db
    environment:
      POSTGRES_USER: expertflow
      POSTGRES_PASSWORD: expertflow_dev
      POSTGRES_DB: expertflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: expertflow-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
