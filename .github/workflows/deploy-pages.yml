name: Deploy to GitHub Pages

# Pages 以"分支模式"从 gh-pages 分支发布；
# 此工作流在 main 更新时把内容同步到 gh-pages，触发自动重新部署。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push origin HEAD:gh-pages --force
