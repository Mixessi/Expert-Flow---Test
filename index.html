<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#4E5969;background:#F7F8FA;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;line-height:1.7}

.go{display:inline-block;margin-top:18px;font-size:14px;font-weight:700}

.v2 .go{color:#3B5BDB}
.foot{text-align:center;margin-top:36px;font-size:12.5px;color:#86909C}
@media(max-width:680px){.cards{grid-template-columns:1fr}h1{font-size:24px}}
